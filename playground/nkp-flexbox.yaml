# playground/nkp-flexbox.yaml
# iximious Flexbox playground definition — NKP 5-VM cluster lab
#
# Topology:
#   vm1 (bootstrap)     172.16.0.10  Ubuntu 24.04  nkp CLI + kubectl + kind
#   vm2 (controlplane)  172.16.0.11  Rocky 9.7     RKE2 server
#   vm3 (worker-01)     172.16.0.12  Rocky 9.7     RKE2 agent
#   vm4 (worker-02)     172.16.0.13  Rocky 9.7     RKE2 agent
#   vm5 (worker-03)     172.16.0.14  Rocky 9.7     RKE2 agent
#
# Network: 172.16.0.0/24 (iximious default local subnet)
#   MetalLB pool: 172.16.0.100–172.16.0.120 (outside VM IPs, inside subnet)
#
# Schema based on iximius Labs playground API (observed from k3s playground):
#   networks: list of named L2 segments
#   machines: each VM — name, users, drives (source = rootfs name, size), network, resources
#   tabs:     IDE / terminal panels shown in the UI

name: nkp-lab
title: "NKP — Nutanix Kubernetes Platform Lab"
description: >
  Full 5-VM NKP lab environment. vm1 is the operator workstation (nkp CLI, kind bootstrap cluster).
  vm2–vm5 run Rocky Linux 9.7 with RKE2 pre-installed, mirroring real NKP node VMs.

networks:
  - name: local
    subnet: 172.16.0.0/24

machines:

  # ── vm1: Bootstrap / operator workstation ────────────────────────────────
  - name: bootstrap
    users:
      - name: root
      - name: laborant
        default: true
    drives:
      - source: nkp-bootstrap     # custom rootfs built from rootfs/bootstrap/
        mount: /
        size: 10GiB
    network:
      interfaces:
        - network: local
          address: 172.16.0.10/24
    resources:
      cpuCount: 4
      ramSize: 4GiB

  # ── vm2: Management Cluster control plane ─────────────────────────────────
  - name: controlplane
    users:
      - name: root
      - name: laborant
        default: true
    drives:
      - source: nkp-controlplane  # custom rootfs built from rootfs/controlplane/
        mount: /
        size: 15GiB
    network:
      interfaces:
        - network: local
          address: 172.16.0.11/24
    resources:
      cpuCount: 4
      ramSize: 8GiB

  # ── vm3: Worker node 1 ────────────────────────────────────────────────────
  - name: worker-01
    users:
      - name: root
      - name: laborant
        default: true
    drives:
      - source: nkp-worker        # custom rootfs built from rootfs/worker/
        mount: /
        size: 15GiB
    network:
      interfaces:
        - network: local
          address: 172.16.0.12/24
    resources:
      cpuCount: 4
      ramSize: 8GiB

  # ── vm4: Worker node 2 ────────────────────────────────────────────────────
  - name: worker-02
    users:
      - name: root
      - name: laborant
        default: true
    drives:
      - source: nkp-worker        # same rootfs image reused for all workers
        mount: /
        size: 15GiB
    network:
      interfaces:
        - network: local
          address: 172.16.0.13/24
    resources:
      cpuCount: 4
      ramSize: 8GiB

  # ── vm5: Worker node 3 ────────────────────────────────────────────────────
  - name: worker-03
    users:
      - name: root
      - name: laborant
        default: true
    drives:
      - source: nkp-worker
        mount: /
        size: 15GiB
    network:
      interfaces:
        - network: local
          address: 172.16.0.14/24
    resources:
      cpuCount: 4
      ramSize: 8GiB

# ── UI tabs ───────────────────────────────────────────────────────────────────
# One IDE on the bootstrap node; individual terminals for every VM.
tabs:
  - id: ide-bootstrap
    kind: ide
    name: IDE
    machine: bootstrap
    enabled: true

  - id: terminal-bootstrap
    kind: terminal
    name: bootstrap
    machine: bootstrap
    enabled: true

  - id: terminal-controlplane
    kind: terminal
    name: controlplane
    machine: controlplane
    enabled: true

  - id: terminal-worker-01
    kind: terminal
    name: worker-01
    machine: worker-01
    enabled: true

  - id: terminal-worker-02
    kind: terminal
    name: worker-02
    machine: worker-02
    enabled: true

  - id: terminal-worker-03
    kind: terminal
    name: worker-03
    machine: worker-03
    enabled: true
