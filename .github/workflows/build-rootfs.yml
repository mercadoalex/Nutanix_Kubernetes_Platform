name: Build and push rootfs images

# Builds all three NKP lab OCI images and pushes them to GHCR.
# Triggered on push to main (when rootfs changes) or manually.
#
# Images produced:
#   ghcr.io/mercadoalex/nkp-bootstrap:latest    — vm1 (Ubuntu 24.04 + nkp + kind + k9s)
#   ghcr.io/mercadoalex/nkp-controlplane:latest  — vm2 (Rocky 9.7 + RKE2 server)
#   ghcr.io/mercadoalex/nkp-worker:latest        — vm3–5 (Rocky 9.7 + RKE2 agent)
#
# The nkp binary is downloaded automatically from the D2iQ public CDN:
#   https://downloads.d2iq.com/dkp/v2.17.1/nkp_v2.17.1_linux_amd64.tar.gz
# No secrets or portal accounts required.
#
# Same pattern used in other iximious courses (see K8s_gpu_lab).
# You can also build and push locally from macOS:
#   cd rootfs && make all

on:
  push:
    branches: [main]
    paths:
      - 'rootfs/**'
      - '.github/workflows/build-rootfs.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: mercadoalex

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nkp-bootstrap
            context: rootfs/bootstrap

          - image: nkp-controlplane
            context: rootfs/controlplane

          - image: nkp-worker
            context: rootfs/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-${{ matrix.image }}
          key: buildx-${{ matrix.image }}-${{ hashFiles(format('{0}/Dockerfile', matrix.context)) }}
          restore-keys: |
            buildx-${{ matrix.image }}-

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.image }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.image }}-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.image }}
          mv /tmp/.buildx-cache-${{ matrix.image }}-new /tmp/.buildx-cache-${{ matrix.image }}
