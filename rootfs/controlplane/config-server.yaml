# RKE2 server default config for the NKP lab control plane (vm2)
# /etc/rancher/rke2/config.yaml
#
# token: set at runtime — students run:
#   echo "MY_SHARED_TOKEN" > /etc/rancher/rke2/config.yaml-token
# or export TOKEN before starting the service.
#
# The tls-san entries cover both the static IP and the hostname used
# across the Flexbox playground subnet.

# Cluster token — override at runtime with a strong value
# token: "changeme-set-at-runtime"

# Advertise the static control-plane IP so worker nodes can reach the API
# node-ip: "192.168.0.11"   # set by lab setup script

# TLS SANs — add all IPs/hostnames that nodes use to reach the API server
tls-san:
  - "192.168.0.11"
  - "vm2"

# CNI — Cilium (NKP default)
cni: cilium

# Disable the default Traefik and ServiceLB (we deploy MetalLB separately)
# and the rke2 built-in nginx ingress in favour of Traefik HelmRelease
disable:
  - rke2-ingress-nginx

# Write kubeconfig with world-readable permissions so laborant user can read it
write-kubeconfig-mode: "0644"
