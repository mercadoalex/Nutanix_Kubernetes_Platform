# RKE2 server config for the NKP lab control plane (vm2 / controlplane)
# /etc/rancher/rke2/config.yaml
#
# Token is fixed so workers can join automatically at boot without
# any manual intervention. Students do NOT need to set this themselves.

# Fixed cluster token — shared with all worker nodes in the rootfs build
token: "nkp-lab-token-2024"

# TLS SANs — covers the static Flexbox IP and the VM hostname
tls-san:
  - "172.16.0.11"
  - "controlplane"

# CNI — Cilium (NKP default)
cni: cilium

# Disable the rke2 built-in nginx ingress
disable:
  - rke2-ingress-nginx

# Write kubeconfig world-readable so laborant user can read it without sudo
write-kubeconfig-mode: "0644"
