# RKE2 agent config for NKP lab worker nodes (worker-01, worker-02, worker-03)
# /etc/rancher/rke2/config.yaml
#
# Token and server are baked in so workers join automatically at boot.
# Students do NOT need to set these manually.

# Fixed control plane endpoint (port 9345 = RKE2 registration, not 6443)
server: "https://172.16.0.11:9345"

# Fixed token — must match token in controlplane/config-server.yaml
token: "nkp-lab-token-2024"
